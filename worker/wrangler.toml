# worker/wrangler.toml — Config de despliegue del Worker IA & Jobs (§0.3).
# Los secretos NO van aquí: usar `npx wrangler secret put WORKER_SECRET_KEY`
# y `npx wrangler secret put GEMINI_API_KEY` desde worker/.

name = "plan-maestro-ia"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Límites conservadores: los jobs de IA son cortos (drafts con aprobación humana).
[limits]
cpu_ms = 5000

# Vars públicas (no secretas). Añadir account_id al desplegar:
# account_id = "<tu-account-id>"
[vars]
APP_ORIGIN = "https://alexanderwoodcock.github.io"
NOTION_TASKS_DB_ID = "3d0e80ddc86681ac9e83e45d68760003"
NOTION_CAREER_DB_ID = "3d0e80ddc866812c8912c4933f965293"
NOTION_SESSIONS_DB_ID = "3d0e80ddc86681c39629f28b92b544c0"
NOTION_MEASUREMENTS_DB_ID = "3d0e80ddc86681ad92b2c81f23037fd0"
